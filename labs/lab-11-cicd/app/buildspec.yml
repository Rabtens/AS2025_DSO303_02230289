version: 0.2

env:
  variables:
    SERVICE_NAME: "enrolment"
    ARTIFACT_DIR: "dist"

phases:

  install:
    commands:
      - echo "--- install ---"
      - python3 --version
      - sed --version 2>/dev/null | head -1 || echo "BSD sed"

  pre_build:
    commands:
      - echo "--- pre_build ---"
      - test -f VERSION || { echo "VERSION file is missing"; exit 1; }
      - |
        python3 -c '
        import json, sys
        expected = "enrolment-api"
        with open("config/service.json") as config:
            actual = json.load(config).get("container")
        if actual != expected:
            sys.exit(f"Container mismatch: expected {expected!r}, actual {actual!r}")
        '
      - echo "configuration validated"

  build:
    commands:
      - echo "--- build ---"
      - USMS_RELEASE="$(tr -d '[:space:]' < VERSION)"
      - BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - echo "release=$USMS_RELEASE builtAt=$BUILT_AT"
      - rm -rf "$ARTIFACT_DIR"
      - mkdir -p "$ARTIFACT_DIR"
      - cp -R src/. "$ARTIFACT_DIR"/
      - sed -i.bak -e "s|__RELEASE__|$USMS_RELEASE|g" -e "s|__BUILT_AT__|$BUILT_AT|g" "$ARTIFACT_DIR/index.html"
      - rm -f "$ARTIFACT_DIR/index.html.bak"
      - |
        cat > "$ARTIFACT_DIR/build-metadata.json" << META
        {
          "service": "$SERVICE_NAME",
          "release": "$USMS_RELEASE",
          "builtAt": "$BUILT_AT",
          "buildId": "${CODEBUILD_BUILD_ID:-local}",
          "sourceVersion": "${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}"
        }
        META
      - cp config/service.json "$ARTIFACT_DIR/service.json"
      - |
        python3 - "$ARTIFACT_DIR" "${IMAGE_URI:-public.ecr.aws/nginx/nginx:stable-alpine}" <<'PYCODE'
        import json, sys
        from pathlib import Path

        container = json.loads(Path("config/service.json").read_text())["container"]
        output = Path(sys.argv[1]) / "imagedefinitions.json"
        output.write_text(json.dumps([{"name": container, "imageUri": sys.argv[2]}]) + "\n")
        PYCODE

  post_build:
    commands:
      - echo "--- post_build ---"
      - |
        TEST_STATUS=0
        bash tests/smoke.sh || TEST_STATUS=$?
        (exit "$TEST_STATUS")
      - ls -l "$ARTIFACT_DIR"
      - cat "$ARTIFACT_DIR/build-metadata.json"

    finally:
      - |
        mkdir -p "$ARTIFACT_DIR"
        printf 'release=%s test_exit_status=%s timestamp=%s\n' \
          "$(tr -d '[:space:]' < VERSION)" "${TEST_STATUS:-not-run}" \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$ARTIFACT_DIR/build-summary.txt"

artifacts:
  base-directory: dist
  files:
    - '**/*'

cache:
  paths: []
